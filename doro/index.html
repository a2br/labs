<style>
:root{
  --ground:#F4E8D8; --surface:#FBF4E9; --ink:#2C221B; --muted:#8F7B6C; --line:#E2D2BE; --track:#E9DCC9;
  --work:#C9502E; --work-deep:#A63E22; --rest:#3F7F7C; --rest-deep:#2F6360; --accent:var(--work); --accent-deep:var(--work-deep);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ground:#241A15; --surface:#2F241D; --ink:#F3E8DA; --muted:#AE9887; --line:#4A3A2F; --track:#3D2F27; --work:#E06A45; --work-deep:#C2552F; --rest:#5FA6A2; --rest-deep:#4A8F8B; }
}
:root[data-theme="dark"]{ --ground:#241A15; --surface:#2F241D; --ink:#F3E8DA; --muted:#AE9887; --line:#4A3A2F; --track:#3D2F27; --work:#E06A45; --work-deep:#C2552F; --rest:#5FA6A2; --rest-deep:#4A8F8B; }
body[data-mode="rest"]{ --accent:var(--rest); --accent-deep:var(--rest-deep); }

html,body{ height:100%; }
body{ margin:0; background:var(--ground); color:var(--ink); font-family:'Instrument Sans',system-ui,sans-serif; font-size:15px; line-height:1.4; -webkit-font-smoothing:antialiased; }
*,*::before,*::after{ box-sizing:border-box; }
.serif{ font-family:Newsreader,Georgia,'Times New Roman',serif; }
.app{ max-width:880px; margin:0 auto; padding-block:22px 36px; padding-inline:20px; display:flex; flex-direction:column; justify-content:center; gap:40px; min-height:100%; }
.top{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; }
.top .mute{ justify-self:end; }
.brand{ font-family:Newsreader,Georgia,serif; font-style:italic; font-size:24px; }
.mute{ width:40px; height:40px; border-radius:50%; border:0; background:transparent; color:var(--muted); cursor:pointer; display:grid; place-items:center; }
.mute:hover{ color:var(--ink); background:var(--surface); }
.mute:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.mute svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.mute .off{ display:none; } .mute.muted .off{ display:block; } .mute.muted .on{ display:none; }

.main{ display:grid; grid-template-columns:1fr auto; gap:28px 40px; align-items:center; }
.left{ display:flex; flex-direction:column; align-items:flex-start; gap:24px; min-width:0; }
.modes{ display:inline-flex; height:40px; border:1.5px solid var(--line); border-radius:999px; padding:3px; background:var(--surface); }
.modes button{ font:inherit; font-weight:600; font-size:14px; letter-spacing:.02em; border:0; background:transparent; color:var(--muted); padding:0 20px; border-radius:999px; cursor:pointer; }
.modes button:hover{ color:var(--ink); }
.modes button[aria-pressed="true"]{ color:#fff; }
.modes button[data-mode="work"][aria-pressed="true"]{ background:var(--work); }
.modes button[data-mode="rest"][aria-pressed="true"]{ background:var(--rest); }
.modes button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.clock{ display:flex; align-items:center; gap:18px; }
.time{ font-family:Newsreader,Georgia,serif; font-weight:400; font-size:clamp(72px, 14vw, 128px); line-height:.95; letter-spacing:-.02em; font-variant-numeric:tabular-nums; color:var(--ink); }
.step{ width:40px; height:40px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:20px; line-height:1; cursor:pointer; display:grid; place-items:center; }
.step:hover{ border-color:var(--ink); }
.step:disabled{ opacity:.3; cursor:default; border-color:var(--line); }
.step:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.sub{ font-family:Newsreader,Georgia,serif; font-style:italic; font-size:22px; color:var(--muted); margin:-8px 0 0; }
.sub b{ font-weight:500; font-style:normal; color:var(--accent); }
.actions{ display:flex; flex-wrap:wrap; align-items:center; gap:12px 16px; }
.links{ display:flex; gap:4px; }
.presets{ display:inline-flex; height:48px; border:1.5px solid var(--line); border-radius:999px; padding:3px; background:var(--surface); }
.presets button{ font:inherit; font-weight:600; font-size:14px; border:0; background:transparent; color:var(--muted); padding:0 14px; border-radius:999px; cursor:pointer; font-variant-numeric:tabular-nums; white-space:nowrap; }
.presets button:disabled{ opacity:.4; cursor:default; }
.presets button:hover{ color:var(--ink); }
.presets button[aria-pressed="true"]{ background:var(--ink); color:var(--ground); }
.presets button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.btn{ font:inherit; font-weight:600; font-size:16px; border:0; background:var(--accent); color:#fff; height:48px; padding:0 32px; border-radius:999px; cursor:pointer; min-width:180px; transition:background .15s; }
.btn:hover{ background:var(--accent-deep); }
.btn:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }
.link{ font:inherit; font-size:14px; font-weight:600; color:var(--muted); background:transparent; border:0; cursor:pointer; height:48px; padding:0 10px; border-radius:999px; display:inline-flex; align-items:center; }
.link:hover{ color:var(--ink); background:var(--surface); }
.link:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.side{ display:flex; flex-direction:column; align-items:center; gap:6px; }
#c{ width:264px; height:264px; display:block; image-rendering:pixelated; image-rendering:crisp-edges; touch-action:pan-y; cursor:grab; }
#c.locked{ cursor:default; }

.day{ display:flex; flex-direction:column; gap:12px; border-top:1.5px solid var(--line); padding-top:22px; }
.dayhead{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:6px 16px; }
.dayhead h2{ margin:0; font-family:Newsreader,Georgia,serif; font-weight:500; font-size:22px; }
.dayhead p{ margin:0; color:var(--muted); font-size:14px; }
.dayhead p b{ color:var(--ink); font-weight:600; }
.tl{ width:100%; height:auto; display:block; overflow:visible; }
.tl .track{ fill:var(--track); }
.tl .work{ fill:var(--work); } .tl .rest{ fill:var(--rest); }
.tl .live{ opacity:.7; }
.tl .flow{ opacity:.45; }
.tl .now{ stroke:var(--ink); stroke-width:1.5; }
.tl .eod{ stroke:var(--muted); stroke-width:1; stroke-dasharray:3 3; }
.tl .ghost{ fill:none; stroke:var(--work); stroke-width:1; stroke-dasharray:3 3; opacity:.5; }
.tl .hour{ stroke:var(--line); stroke-width:1; }
.tl text{ font-family:'Instrument Sans',system-ui,sans-serif; font-size:11px; fill:var(--muted); }
.legend{ display:flex; gap:18px; font-size:13px; color:var(--muted); }
.legend i{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
.legend .w i{ background:var(--work); } .legend .r i{ background:var(--rest); } .legend .f i{ background:var(--accent); opacity:.45; }

@media (max-width:640px){
  .main{ grid-template-columns:1fr; gap:10px; }
  .side{ order:-1; align-self:center; }
  .left{ align-items:center; }
  .actions{ justify-content:center; }
  .btn{ width:100%; }
  .sub{ text-align:center; }
}
</style>

<main class="app">
  <header class="top">
    <div class="brand">doro</div>
    <div class="modes" role="group" aria-label="Mode">
      <button data-mode="work" id="modeWork" aria-pressed="true">Work</button>
      <button data-mode="rest" id="modeRest" aria-pressed="false">Rest</button>
    </div>
    <button class="mute" id="mute" aria-label="Sound on" aria-pressed="false">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>
    </button>
  </header>

  <section class="main">
    <div class="left">
      <div class="clock">
        <button class="step" id="minus" aria-label="One minute less">&minus;</button>
        <div class="time" id="time">25:00</div>
        <button class="step" id="plus" aria-label="One minute more">+</button>
      </div>
      <p class="sub" id="sub"><b>work</b> for 25 minutes</p>
      <div class="actions">
        <button class="btn" id="startBtn">Start</button>
        <div class="presets" id="presets" role="group" aria-label="Presets">
          <button data-w="25" data-r="5">25 / 5</button>
          <button data-w="45" data-r="15">45 / 15</button>
          <button data-w="50" data-r="10">50 / 10</button>
        </div>
        <div class="links"><button class="link" id="resetBtn">reset</button><button class="link" id="skipBtn">skip</button></div>
      </div>
    </div>
    <div class="side">
      <canvas id="c" width="106" height="106" aria-hidden="true"></canvas>
    </div>
  </section>

  <section class="day">
    <div class="dayhead">
      <h2>Today</h2>
      <p id="summary">Nothing yet.</p>
    </div>
    <svg class="tl" id="tl" viewBox="0 0 1000 58" aria-hidden="true"></svg>
    <div class="legend"><span class="w"><i></i>work</span><span class="r"><i></i>rest</span><span class="f"><i></i>past the timer</span></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  if (window.__ripen){ try{ window.__ripen.teardown(); }catch(e){} }
  const $ = s => document.querySelector(s);
  const KEY = 'ripen', VOL = 0.7, TAU = Math.PI*2, MIN = 60000;
  const S = { mode:'work', sel:'work', durations:{work:25, rest:5}, running:false, endAt:0, remaining:25*MIN, finished:null, muted:false, flow:null, flowSince:0 };
  const FLOW_CAP = 2; // keep counting past the timer for up to 2x the planned length
  let SEG = [];       // active stretches: {s, e, mode, done}
  let segStart = 0;   // start of the current active stretch

  // ---------- persistence ----------
  function load(){
    try{
      const j = JSON.parse(localStorage.getItem(KEY) || '{}'), st = j.settings || {};
      if (st.durations){ if (st.durations.work) S.durations.work = st.durations.work; if (st.durations.rest) S.durations.rest = st.durations.rest; if (!st.durations.work && st.durations.focus) S.durations.work = st.durations.focus; }
      S.muted = !!st.muted;
      if (Array.isArray(j.segments)) SEG = j.segments.filter(x => x && x.s && x.e);
      else if (Array.isArray(j.history)) SEG = j.history.filter(h => h && h.t).map(h => ({ s:h.t - (h.min||25)*MIN, e:h.t, mode:h.mode === 'focus' || h.mode === 'work' ? 'work' : 'rest', done:true }));
    }catch(e){ SEG = []; }
    S.remaining = total();
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify({ version:3, settings:{durations:S.durations, muted:S.muted}, segments:SEG.slice(-5000) })); }catch(e){} }
  function closeSegment(done, mode, flow){ if (!segStart) return; const e = Date.now(); if (e - segStart > 1000) SEG.push({ s:segStart, e, mode:mode || S.mode, done:!!done, flow:!!flow || undefined }); segStart = 0; save(); }
  // after a timer ends, time keeps counting toward that mode until the next timer starts
  function endFlow(){ if (!S.flow) return; closeSegment(true, S.flow, true); S.flow = null; S.flowSince = 0; }
  function flowCap(){ return S.flow ? S.durations[S.flow] * MIN * FLOW_CAP : 0; }

  // ---------- audio ----------
  let ctx = null, master = null;
  function ac(){
    if (!ctx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); master = ctx.createGain(); master.gain.value = S.muted ? 0 : VOL; master.connect(ctx.destination); }
    if (ctx.state === 'suspended') ctx.resume().catch(()=>{});
    return ctx;
  }
  function noiseBuf(c){ if (c._nb) return c._nb; const b = c.createBuffer(1, Math.floor(c.sampleRate*0.5), c.sampleRate), d = b.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; return c._nb = b; }
  function blip(c, t, f0, f1, dur, g, type, out){
    const o = c.createOscillator(), v = c.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t+dur);
    v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(g, t+0.006); v.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(v); v.connect(out || master); o.start(t); o.stop(t+dur+0.03); return o;
  }
  function noise(c, t, freq, q, dur, g, out, type){
    const s = c.createBufferSource(); s.buffer = noiseBuf(c); const f = c.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const v = c.createGain(); v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(f); f.connect(v); v.connect(out || master); s.start(t); s.stop(t+dur+0.03); return s;
  }
  function strike(c, out, t, f0, decay, amp, nodes){
    [[1,1],[2.42,0.5],[3.9,0.28],[5.7,0.12]].forEach(([m,a])=>{ const o = c.createOscillator(), g = c.createGain(); o.frequency.value = f0*m;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(a*amp, t+0.003); g.gain.exponentialRampToValueAtTime(0.0001, t+decay);
      o.connect(g); g.connect(out); o.start(t); o.stop(t+decay+0.05); nodes.push(o); });
    nodes.push(noise(c, t, 4500, 0.7, 0.03, 0.12, out, 'highpass'));
  }
  function bell(c, at){ const v = c.createGain(); v.connect(master); const nodes = []; [0, 1.25].forEach(off=>{ for (let i=0;i<10;i++) strike(c, v, at+off+i*0.055, 2050, 0.22, 0.2, nodes); strike(c, v, at+off+0.6, 2050, 2.4, 0.34, nodes); }); return {gain:v, nodes}; }
  function chime(c, at){ const v = c.createGain(); v.connect(master); const nodes = []; strike(c, v, at, 1320, 1.6, 0.3, nodes); strike(c, v, at+0.45, 990, 2.2, 0.3, nodes); return {gain:v, nodes}; }
  const SFX = {
    click(){ const c = ac(); if(!c) return; const t = c.currentTime; noise(c,t,2500,1.5,0.04,0.25); blip(c,t,520,300,0.07,0.15,'triangle'); },
    ratchet(){ const c = ac(); if(!c) return; const t = c.currentTime; noise(c,t,3800,3,0.025,0.4); blip(c,t,1900,1300,0.03,0.07,'square'); },
    start(){ const c = ac(); if(!c) return; const t = c.currentTime; blip(c,t,523,null,0.12,0.2,'triangle'); blip(c,t+0.12,784,null,0.2,0.2,'triangle'); },
    pause(){ const c = ac(); if(!c) return; const t = c.currentTime; blip(c,t,784,null,0.1,0.18,'triangle'); blip(c,t+0.1,523,null,0.22,0.18,'triangle'); },
    boop(){ const c = ac(); if(!c) return; const t = c.currentTime;
      for (let i=0;i<7;i++) noise(c, t+i*0.035, 2200+Math.random()*3500, 7, 0.028, 0.32);
      [[988,0],[784,0.06],[659,0.12],[523,0.18]].forEach(([f,d]) => blip(c,t+d,f,null,0.055,0.11,'square'));
      noise(c,t+0.3,700,2,0.09,0.28); blip(c,t+0.3,180,120,0.08,0.12,'square'); }
  };

  // ---------- timer ----------
  let raf = 0, pending = null, bellAt = 0, wake = null;
  const total = () => S.durations[S.mode] * MIN;
  const fresh = () => !S.running && S.remaining === total();
  const inProgress = () => S.running || S.remaining !== total();
  const pendingSwitch = () => S.sel !== S.mode && inProgress();
  const editMode = () => pendingSwitch() ? S.sel : S.mode;            // whose duration the selector edits
  const canEdit = () => fresh() || pendingSwitch();
  const shownMs = () => pendingSwitch() ? S.durations[S.sel] * MIN : S.remaining; // what the big clock shows
  const other = m => m === 'work' ? 'rest' : 'work';
  function armBell(c){ cancelPending(); if (!c) return; bellAt = c.currentTime + S.remaining/1000; pending = (S.mode === 'work' ? bell : chime)(c, bellAt); }
  function cancelPending(){ if (!pending) return; pending.nodes.forEach(n => { try{ n.stop(0); }catch(e){} }); try{ pending.gain.disconnect(); }catch(e){} pending = null; }
  function start(silent){
    if (S.running) return;
    if (S.remaining <= 0) S.remaining = total();
    const c = ac();
    endFlow();
    S.running = true; S.finished = null; S.endAt = Date.now() + S.remaining; segStart = Date.now();
    if (!silent) SFX.start();
    if (c) armBell(c);
    requestWake(); render();
  }
  function stop(silent){
    if (!S.running) return;
    S.running = false; S.remaining = Math.max(0, S.endAt - Date.now());
    cancelPending(); releaseWake(); closeSegment(false);
    if (!silent) SFX.pause();
    render();
  }
  function tick(){ if (!S.running) return; const rem = S.endAt - Date.now(); if (rem <= 0){ finish(); return; } S.remaining = rem; render(); }
  function finish(){
    const c = ctx, alreadyRang = !!(c && pending && c.currentTime >= bellAt - 0.05);
    S.running = false;
    releaseWake();
    if (!alreadyRang){ cancelPending(); if (c) (S.mode === 'work' ? bell : chime)(c, c.currentTime + 0.02); }
    pending = null;
    closeSegment(true);
    const prev = S.mode;
    S.flow = prev; S.flowSince = Date.now(); segStart = Date.now();
    S.mode = S.sel = other(prev); S.remaining = total(); S.finished = prev;
    render(); flashTitle();
  }
  // the toggle only selects; nothing in progress is touched until you start the other timer
  function selectMode(m){ S.sel = m; if (!inProgress()){ S.mode = m; S.remaining = total(); } SFX.click(); render(); save(); }
  function loadMode(m){ if (S.running) stop(true); endFlow(); S.mode = S.sel = m; S.remaining = total(); S.finished = null; render(); save(); }
  function primary(){ if (pendingSwitch()){ stop(true); S.mode = S.sel; S.remaining = total(); S.finished = null; start(); } else toggle(); }
  function reset(){ stop(true); endFlow(); S.sel = S.mode; S.remaining = total(); S.finished = null; SFX.click(); render(); }
  function skip(){ SFX.click(); loadMode(other(S.mode)); }
  function toggle(){ S.running ? stop() : start(); }
  function setMinutes(n){
    n = Math.max(1, Math.min(60, Math.round(n)));
    const m = editMode();
    if (!canEdit() || n === S.durations[m]) return;
    S.durations[m] = n;
    if (!pendingSwitch()){ S.remaining = n*MIN; S.finished = null; }
    SFX.ratchet(); render(); save();
  }
  const nudge = d => setMinutes(S.durations[editMode()] + d);
  function setMuted(m){ S.muted = m; if (master) master.gain.value = m ? 0 : VOL; muteBtn.classList.toggle('muted', m); muteBtn.setAttribute('aria-pressed', m); muteBtn.setAttribute('aria-label', m ? 'Sound off' : 'Sound on'); save(); }
  async function requestWake(){ try{ if ('wakeLock' in navigator && document.visibilityState === 'visible'){ wake = await navigator.wakeLock.request('screen'); } }catch(e){} }
  function releaseWake(){ try{ wake && wake.release(); }catch(e){} wake = null; }

  // ---------- render ----------
  const timeEl = $('#time'), subEl = $('#sub'), startBtn = $('#startBtn'), minus = $('#minus'), plus = $('#plus'), muteBtn = $('#mute'), canvas = $('#c'),
        modeWork = $('#modeWork'), modeRest = $('#modeRest'), tl = $('#tl'), summary = $('#summary'), presetBtns = [...document.querySelectorAll('#presets button')];
  const baseTitle = document.title; let titleFlash = 0, lastTL = 0;
  function fmt(ms){ const s = Math.ceil(ms/1000); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
  function render(){
    const rem = S.remaining, t = fmt(rem), isFresh = rem === total(), mins = S.durations[S.mode];
    const shown = fmt(shownMs());
    if (timeEl.textContent !== shown) timeEl.textContent = shown;
    document.body.dataset.mode = S.sel;
    modeWork.setAttribute('aria-pressed', S.sel === 'work'); modeRest.setAttribute('aria-pressed', S.sel === 'rest');
    const sw = pendingSwitch();
    let sub;
    if (sw) sub = '<b>' + S.sel + '</b> for ' + S.durations[S.sel] + (S.durations[S.sel] === 1 ? ' minute' : ' minutes') + '. ' + (S.running ? (S.mode === 'work' ? 'Work' : 'Rest') + ' still running, ' : S.mode + ' paused, ') + t + ' left.';
    else if (S.flow) sub = (S.flow === 'work' ? 'Still counting as work, <b>+' + fmt(Date.now() - S.flowSince) + '</b>. Rest when ready.' : 'Still resting, <b>+' + fmt(Date.now() - S.flowSince) + '</b>. Work when ready.');
    else if (S.finished) sub = S.finished === 'work' ? 'Work done. <b>Rest</b> for ' + mins + (mins === 1 ? ' minute?' : ' minutes?') : 'Rested. Back to <b>work</b> for ' + mins + (mins === 1 ? ' minute?' : ' minutes?');
    else if (S.running) sub = S.mode === 'work' ? '<b>Working.</b> Stay with it.' : '<b>Resting.</b> Look away from the screen.';
    else if (!isFresh) sub = 'Paused';
    else sub = '<b>' + S.mode + '</b> for ' + mins + (mins === 1 ? ' minute' : ' minutes');
    if (subEl.innerHTML !== sub) subEl.innerHTML = sub;
    startBtn.textContent = sw ? 'Start ' + S.sel : S.running ? 'Pause' : (!isFresh && rem > 0 ? 'Resume' : (S.finished ? 'Start ' + S.mode : 'Start'));
    minus.disabled = plus.disabled = !canEdit();
    presetBtns.forEach(b => { b.setAttribute('aria-pressed', +b.dataset.w === S.durations.work && +b.dataset.r === S.durations.rest); b.disabled = S.running; });
    canvas.classList.toggle('locked', !canEdit());
    if (!titleFlash) document.title = S.running || !isFresh ? `${t} \u00B7 ${S.mode}` : baseTitle;
    const now = Date.now();
    if (now - lastTL > 1000 || !S.running){ lastTL = now; renderDay(); }
  }
  function flashTitle(){ clearInterval(titleFlash); let n = 0; titleFlash = setInterval(()=>{ document.title = (n++ % 2) ? baseTitle : '\uD83D\uDD14 Time is up'; if (n > 10){ clearInterval(titleFlash); titleFlash = 0; render(); } }, 900); }

  // ---------- today's timeline ----------
  const hm = ms => { const m = Math.round(ms/MIN), h = Math.floor(m/60); return h ? h + 'h ' + String(m%60).padStart(2,'0') + 'm' : m + 'm'; };
  function renderDay(){
    const now = Date.now(), d0 = new Date(); d0.setHours(0,0,0,0); const day = d0.getTime();
    const segs = SEG.filter(x => x.e > day).map(x => ({ ...x, s:Math.max(x.s, day) }));
    if (S.running && segStart) segs.push({ s:segStart, e:now, mode:S.mode, done:false, live:true });
    else if (S.flow && segStart) segs.push({ s:segStart, e:now, mode:S.flow, done:false, live:true, flow:true });
    const hourOf = t => (t - day) / 3600000, EOD = 18, eod = day + EOD*3600000;
    // axis starts at the hour of the first session (or now, on an empty day) and runs to at least 18:00
    let h0 = Math.floor(hourOf(segs.length ? Math.min(...segs.map(x => x.s)) : now)), h1 = EOD;
    for (const x of segs) h1 = Math.max(h1, Math.ceil(hourOf(x.e)));
    h1 = Math.max(h1, Math.min(24, Math.floor(hourOf(now)) + 1)); h0 = Math.max(0, Math.min(h0, h1 - 2));
    // room left before 18:00, counted from the end of whatever is in progress
    const cycle = (S.durations.work + S.durations.rest) * MIN, from = S.running ? S.endAt : now;
    const room = eod > from ? Math.floor((eod - from + S.durations.rest*MIN) / cycle) : 0;
    const W = Math.max(300, Math.round(tl.clientWidth || 1000)); tl.setAttribute('viewBox', `0 0 ${W} 58`);
    const X = t => ((hourOf(t) - h0) / (h1 - h0)) * W;
    let svg = `<rect class="track" x="0" y="6" width="${W}" height="28" rx="6"/>`;
    for (let h = h0; h <= h1; h++){
      const x = X(day + h*3600000);
      svg += `<line class="hour" x1="${x.toFixed(1)}" y1="6" x2="${x.toFixed(1)}" y2="34"/>`;
      const step = W < 500 ? 4 : h1 - h0 > 12 ? 3 : 2;
      if (((h - h0) % step === 0 && h1 - h >= step) || h === h1) svg += `<text x="${x.toFixed(1)}" y="52" text-anchor="${h === h0 ? 'start' : h === h1 ? 'end' : 'middle'}">${h}:00</text>`;
    }
    let work = 0, rest = 0, sessions = 0;
    for (const x of segs){
      const x0 = X(x.s), x1 = Math.max(X(x.e), x0 + 2);
      svg += `<rect class="${x.mode}${x.live ? ' live' : ''}${x.flow ? ' flow' : ''}" x="${x0.toFixed(1)}" y="6" width="${(x1-x0).toFixed(1)}" height="28"/>`;
      if (x.mode === 'work') work += x.e - x.s; else rest += x.e - x.s;
      if (x.done && x.mode === 'work') sessions++;
    }
    for (let i = 0; i < room; i++){ const gs = from + i*cycle, ge = gs + S.durations.work*MIN; svg += `<rect class="ghost" x="${(X(gs)+1).toFixed(1)}" y="9" width="${Math.max(2, X(ge)-X(gs)-2).toFixed(1)}" height="22" rx="3"/>`; }
    if (EOD > h0 && EOD <= h1){ const ex = X(eod); svg += `<line class="eod" x1="${ex.toFixed(1)}" y1="2" x2="${ex.toFixed(1)}" y2="38"/>`; }
    const nx = X(now); svg += `<line class="now" x1="${nx.toFixed(1)}" y1="2" x2="${nx.toFixed(1)}" y2="38"/>`;
    tl.innerHTML = svg;
    const roomTxt = now >= eod ? '18:00 has passed' : room === 0 ? 'no full session left before 18:00' : `room for <b>${room}</b> more before 18:00`;
    summary.innerHTML = (segs.length ? `<b>${sessions}</b> work session${sessions === 1 ? '' : 's'} &middot; <b>${hm(work)}</b> work &middot; <b>${hm(rest)}</b> rest &middot; ` : '') + roomTxt;
  }

  // ---------- the small 3D tomato on the side ----------
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, alpha:true, powerPreference:'low-power' });
  renderer.setPixelRatio(1); renderer.setSize(106, 106, false); renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50); camera.position.set(0, 2.0, 7.0); camera.lookAt(0, 0.45, 0);
  const gd = new Uint8Array([90, 160, 225, 255]); const G = new THREE.DataTexture(gd, 4, 1, THREE.LuminanceFormat); G.minFilter = G.magFilter = THREE.NearestFilter; G.needsUpdate = true;
  const toon = hex => new THREE.MeshToonMaterial({ color:hex, gradientMap:G });
  const matRed = toon(0xd9532f), matGreen = toon(0x6b9a5b), flat = new THREE.MeshBasicMaterial({ color:0x2c221b });
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const key = new THREE.DirectionalLight(0xfff1dc, 0.9); key.position.set(2.5, 4, 3); scene.add(key);
  const rig = new THREE.Group(); scene.add(rig); const timer = new THREE.Group(); rig.add(timer);
  // a real tomato is not a sphere: five soft lobes with creases from stem to base, and a little lopsidedness
  function lobe(geo){
    const pos = geo.attributes.position, v = new THREE.Vector3();
    for (let i=0;i<pos.count;i++){
      v.fromBufferAttribute(pos, i);
      const a = Math.atan2(v.z, v.x), band = Math.sqrt(Math.max(0, 1 - v.y*v.y)); // creases fade out at the poles
      const crease = Math.pow(0.5 + 0.5*Math.cos(5*a + 0.6), 5), lobes = 0.04*Math.cos(5*a + 0.6);
      const wobble = 0.025*Math.sin(2*a + 1.3) + 0.015*Math.cos(3*a - 0.4);
      const k = 1 + (lobes - 0.13*crease + wobble) * band;
      pos.setXYZ(i, v.x*k, v.y, v.z*k);
    }
    pos.needsUpdate = true; geo.computeVertexNormals();
  }
  const botGeo = new THREE.SphereGeometry(1, 40, 10, 0, TAU, Math.PI/2, Math.PI/2); lobe(botGeo);
  const bot = new THREE.Mesh(botGeo, matRed); bot.scale.set(1, 0.78, 1); timer.add(bot);
  const ptr = new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.2, 4), flat); ptr.position.set(0, -0.2, 0.97); ptr.rotation.x = 0.35; timer.add(ptr);
  const eyeGeo = new THREE.BoxGeometry(0.09, 0.09, 0.04);
  [[-0.3],[0.3]].forEach(([x]) => { const e = new THREE.Mesh(eyeGeo, flat); e.position.set(x, -0.27, 0.9); e.rotation.x = 0.3; timer.add(e); });
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.035, 0.04), flat); mouth.position.set(0, -0.47, 0.8); mouth.rotation.x = 0.6; timer.add(mouth);
  const top = new THREE.Group(); top.position.y = 0.1; timer.add(top);
  const topGeo = new THREE.SphereGeometry(1, 40, 10, 0, TAU, 0, Math.PI/2); lobe(topGeo);
  const topMesh = new THREE.Mesh(topGeo, matRed); topMesh.scale.set(1, 0.86, 1); top.add(topMesh);
  const bandCanvas = document.createElement('canvas'); bandCanvas.width = 1200; bandCanvas.height = 64;
  const bandTex = new THREE.CanvasTexture(bandCanvas); bandTex.magFilter = bandTex.minFilter = THREE.NearestFilter;
  (function(){ const g = bandCanvas.getContext('2d'); g.fillStyle = '#fbf4e9'; g.fillRect(0,0,1200,64); g.fillStyle = '#2c221b';
    for (let k=0;k<60;k++){ const x = Math.round(k/60*1200), major = k%5===0; g.fillRect(x-2, 64-(major?26:12), 4, major?26:12); }
    g.font = 'bold 26px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'top'; for (let k=0;k<60;k+=5) g.fillText(String(k), Math.round(k/60*1200), 4); bandTex.needsUpdate = true; })();
  const band = new THREE.Mesh(new THREE.CylinderGeometry(1.06, 1.06, 0.26, 48, 1, true), new THREE.MeshBasicMaterial({ map:bandTex })); band.position.y = -0.04; top.add(band);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.1, 0.4, 6), matGreen); stem.position.set(0.02, 0.98, 0); stem.rotation.z = -0.15; top.add(stem);
  for (let i=0;i<5;i++){ const leaf = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.05, 0.2), matGreen); const a = i/5*TAU + 0.4; leaf.position.set(Math.cos(a)*0.28, 0.86, Math.sin(a)*0.28); leaf.rotation.y = -a; leaf.rotation.z = 0.22; top.add(leaf); }
  // tap animation: the stack pulls apart in layers (base, band, dome, stem) and drops back bottom-up
  // lifts are absolute; band/stem live inside the top group, so their local lift is relative to the dome's
  const parts = [];
  const reg = (o, layer, lift) => parts.push({ o, layer, lift, y0:o.position.y });
  [bot, ptr, mouth, ...timer.children.filter(o => o.geometry === eyeGeo)].forEach(o => reg(o, 0, 0.04));
  reg(band, 1, 0.16 - 0.3);
  reg(top, 2, 0.3);
  [stem, ...top.children.filter(o => o.material === matGreen && o !== stem)].forEach(o => reg(o, 3, 0.48 - 0.3));
  let yaw = 0;
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.95, 16), new THREE.MeshBasicMaterial({ color:0x2c221b, transparent:true, opacity:0.1 })); shadow.rotation.x = -Math.PI/2; shadow.position.y = -0.8; rig.add(shadow);

  let tiltX = 0, tiltY = 0, twist = 0, dragging = false, dragX = 0, dragAcc = 0, hovering = false, moved = 0, tapAt = -1e9;
  const TAP_MS = 520; let tapping = false;
  window.addEventListener('resize', () => renderDay());
  canvas.addEventListener('pointerenter', () => { hovering = true; });
  canvas.addEventListener('pointerleave', () => { hovering = false; tiltX = tiltY = 0; });
  canvas.addEventListener('pointermove', e => { if (!hovering) return; const r = canvas.getBoundingClientRect(); tiltY = ((e.clientX - r.left) / r.width - 0.5) * 0.9; tiltX = ((e.clientY - r.top) / r.height - 0.5) * 0.4; });
  canvas.addEventListener('wheel', e => { e.preventDefault(); if (!canEdit()) return; nudge(e.deltaY > 0 ? 1 : -1); }, { passive:false });
  timeEl.addEventListener('wheel', e => { e.preventDefault(); if (!canEdit()) return; nudge(e.deltaY > 0 ? 1 : -1); }, { passive:false });
  canvas.addEventListener('pointerdown', e => { dragging = true; dragX = e.clientX; dragAcc = 0; moved = 0; try{ canvas.setPointerCapture(e.pointerId); }catch(err){} });
  canvas.addEventListener('pointermove', e => { if (!dragging) return; moved += Math.abs(e.clientX - dragX); if (!canEdit()){ dragX = e.clientX; return; } dragAcc += e.clientX - dragX; dragX = e.clientX; const steps = Math.trunc(dragAcc/12); if (steps){ dragAcc -= steps*12; nudge(steps); } });
  canvas.addEventListener('pointerup', () => { if (dragging && moved < 6){ tapAt = performance.now(); SFX.boop(); } dragging = false; });
  canvas.addEventListener('pointercancel', () => { dragging = false; });
  const clock = new THREE.Clock();
  function frame(){
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, clock.getDelta());
    if (S.running) tick();
    const target = -(shownMs()/MIN)/60 * TAU;
    twist += (target - twist) * Math.min(1, dt*10); top.rotation.y = twist + yaw;
    rig.rotation.y += (tiltY - rig.rotation.y) * Math.min(1, dt*5); rig.rotation.x += (tiltX - rig.rotation.x) * Math.min(1, dt*5);
    // tap: layers separate at once, then drop back in order with a damped bounce; the dome unscrews a little
    const k = (performance.now() - tapAt) / TAP_MS;
    if (k < 1){
      tapping = true;
      const settle = kk => kk >= 1 ? 0 : Math.exp(-4.5*kk) * Math.abs(Math.cos(kk*Math.PI*2.2));
      for (const P of parts){
        const f = settle(Math.min(1, Math.max(0, (k - P.layer*0.06) / 0.7)));
        P.o.position.y = P.y0 + P.lift * f;
        if (P.o === top) yaw = 0.35 * f;
      }
    } else if (tapping){ tapping = false; yaw = 0; for (const P of parts) P.o.position.y = P.y0; }
    renderer.render(scene, camera);
  }

  // ---------- controls ----------
  startBtn.addEventListener('click', primary);
  $('#resetBtn').addEventListener('click', reset);
  $('#skipBtn').addEventListener('click', skip);
  minus.addEventListener('click', () => nudge(-1));
  plus.addEventListener('click', () => nudge(1));
  presetBtns.forEach(b => b.addEventListener('click', () => {
    const w = +b.dataset.w, r = +b.dataset.r; if (S.running || (w === S.durations.work && r === S.durations.rest)) return;
    S.durations.work = w; S.durations.rest = r; S.remaining = total(); S.finished = null; SFX.ratchet(); render(); save();
  }));
  modeWork.addEventListener('click', () => { if (S.sel !== 'work') selectMode('work'); });
  modeRest.addEventListener('click', () => { if (S.sel !== 'rest') selectMode('rest'); });
  muteBtn.addEventListener('click', () => { setMuted(!S.muted); if (!S.muted) SFX.click(); });
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === 'Space'){ if (e.target.closest('button')) return; e.preventDefault(); primary(); }
    else if (e.key === 'r' || e.key === 'R') reset();
    else if (e.key === 'n' || e.key === 'N') skip();
    else if (e.key === 'm' || e.key === 'M') setMuted(!S.muted);
    else if (e.key === 'ArrowUp'){ e.preventDefault(); nudge(1); }
    else if (e.key === 'ArrowDown'){ e.preventDefault(); nudge(-1); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); if (S.sel !== 'work') selectMode('work'); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); if (S.sel !== 'rest') selectMode('rest'); }
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ if (ctx && ctx.state === 'suspended') ctx.resume().catch(()=>{}); if (S.running){ tick(); requestWake(); } else render(); } });
  const backupTimer = setInterval(() => {
    if (S.running) tick();
    else if (S.flow){ if (Date.now() - S.flowSince > flowCap()){ endFlow(); render(); } else { render(); if (Date.now() - lastTL > 1000){ lastTL = Date.now(); renderDay(); } } }
    else if (Date.now() - lastTL > 60000) renderDay();
  }, 500);
  function teardown(){ if (S.running) closeSegment(false); endFlow(); S.running = false; clearInterval(backupTimer); clearInterval(titleFlash); cancelAnimationFrame(raf); cancelPending(); releaseWake(); if (ctx){ try{ ctx.close(); }catch(e){} ctx = null; master = null; } try{ renderer.dispose(); }catch(e){} }
  window.__ripen = { teardown, segments: () => SEG.slice(), S, lastTap: () => tapAt, pose: () => parts.map(P => +(P.o.position.y - P.y0).toFixed(3)) };
  window.addEventListener('pagehide', teardown);

  // ---------- boot ----------
  function boot(hot){
    load();
    if (hot && hot.S){ Object.assign(S, hot.S); if (S.running){ S.remaining = Math.max(0, S.endAt - Date.now()); S.running = false; } }
    if (S.remaining <= 0 || S.remaining > total()) S.remaining = total();
    if (!S.sel) S.sel = S.mode;
    twist = -(shownMs()/MIN)/60 * TAU;
    setMuted(S.muted); render(); frame();
    if (hot && hot.S && hot.S.running && S.remaining > 0) start(true);
  }
  try{ window.claude?.hot?.snapshot?.(() => ({ S: Object.assign({}, S) })); }catch(e){}
  try{ window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? null); }catch(e){ boot(null); }
})();
</script>
</body>
